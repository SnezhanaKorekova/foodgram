version: "3.8"

services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth-service:
    build: .
    command: gunicorn auth_service.wsgi:application --bind 0.0.0.0:8001
    ports:
      - "8001:8001"
    environment:
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: auth_password
      DB_HOST: auth-db
      DB_PORT: 5432
    depends_on:
      - auth-db

volumes:
  auth_db_data:
